<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Прогнози на спорт</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 500px;
      padding: 20px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 15px;
    }

    p {
      font-size: 16px;
      color: #cbd5e1;
      margin-bottom: 25px;
      line-height: 1.4;
    }

    .btn {
      display: inline-block;
      background: #22c55e;
      color: #fff;
      padding: 14px 22px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      transition: 0.2s;
    }

    .btn:hover {
      background: #16a34a;
    }

    .small {
      margin-top: 20px;
      font-size: 12px;
      color: #64748b;
    }

    .badge {
      display: inline-block;
      background: #1d4ed8;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="badge">📊 Прогнози на спорт</div>

    <h1>Точні спортивні прогнози щодня</h1>

    <p>
      Приєднуйся до Telegram-каналу, де публікуються аналітичні прогнози на футбол, теніс та інші види спорту.
      Без води — тільки конкретика.
    </p>

    <a class="btn" href="https://t.me/+zu3R-vC2M3g3Y2Fi" target="_blank">
      👉 Перейти в Telegram
    </a>

    <div class="small">
      *Контент носить інформаційний характер
    </div>
  </div>

</body>
</html>
